name: CI

# Runs only in the public snapshot (Heimdalur), where Actions is enabled and the
# repo is public. The private source repo keeps Actions disabled.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    # Hard guard: this workflow is only for the public snapshot. The private
    # repo keeps Actions disabled; this cannot run even if that setting changes.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: ci
      HEIMDAL_TEST_DB: pdfhist_test_ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          allow-prereleases: true
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Public snapshot gate
        run: bash tools/ci_public.sh
